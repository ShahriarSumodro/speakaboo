version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: speakaboo-backend:latest
    container_name: speakaboo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_PATH=/app/data/speakaboo.db
      - SERVER_DEBUG=false
      - SERVER_LOG_LEVEL=INFO
      - PAYMENT_SANDBOX_MODE=true
    volumes:
      - speakaboo_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  speakaboo_data:
    driver: local
